# Signing gate 1: automated signing identity check (approved plan v1.1, section 8).
# Created By Shane BlackbuRn
#
# Decision (28 Nov 2026, Option A): the watch app uses the SAME signing history as the phone app,
# test key -> production key, with the same capability flags as Android 0.7.2.
#
# This workflow proves that arrangement with THROWAWAY keys (made fresh each run, never stored):
#   key A plays the old public test key, key B plays the production key.
#   1. 0.7.2 reference: reads the signing history of the PUBLISHED Android 0.7.2 APK (public
#      release asset, read only) and checks its capability flags.
#   2. Kit: signs the probe for the phone with A -> B (same apksigner options as 0.7.2's
#      release.yml), and for the watch with key B plus the lineage EXTRACTED from the phone APK,
#      using only key B's private key (as the real watch release will: production key + public
#      lineage, no test-key private key needed).
#   3. Identity: installs each copy on its own emulator (phone, then Wear OS 6 watch; no pairing)
#      and checks both systems report the same current signer and the same signing history.
# Live Data Layer communication is tested at signing gate 2 on real devices.
# No real or production key is ever used here.
name: Signing gate 1 (automated identity check)

on:
  push:
    branches: ["claude/stage-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BT: "36.0.0"
  # Public certificate fingerprints (not secrets)
  TEST_CERT: a9618b324c0ed08d0850953843fe7d6ea4aef6353ccaaffc3e6e53ad4a36e87c
  PROD_CERT: 02f6fc5fb6aed7bc036d51bb95f05de73d3ba7571f5b9665711efbb5dc7a2a60
  REF_APK_URL: https://github.com/shanebl030-glitch/RBSB-Weather-Android/releases/download/v0.7.2/rbsb-weather-android_0.7.2.apk
  REF_APK_SHA256: 66bc5d4491496c34bc55f014c40f5fc3557c5437447860b07d58faf5fdb74611

jobs:
  kit:
    name: Reference flags and probe kit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;$BT" > /dev/null

      - name: "0.7.2 reference: read the published APK's signing history"
        run: |
          set -e
          AS="$ANDROID_HOME/build-tools/$BT/apksigner"
          curl -sSfL -o ref.apk "$REF_APK_URL"
          echo "$REF_APK_SHA256  ref.apk" | sha256sum -c -
          "$AS" lineage --in ref.apk --print-certs -v | tee ref-lineage.txt
          python3 scripts/lineage_check.py ref-lineage.txt --expect-old "$TEST_CERT" --expect-new "$PROD_CERT" --json ref-flags.json
          # The real watch release will reuse this public lineage: check it extracts and reads back
          python3 scripts/extract_lineage.py ref.apk ref-lineage.bin
          "$AS" lineage --in ref-lineage.bin --print-certs -v > ref-lineage-file.txt
          python3 scripts/lineage_check.py ref-lineage-file.txt --expect-old "$TEST_CERT" --expect-new "$PROD_CERT" --json ref-file-flags.json
          cmp <(python3 -c "import json;print(json.load(open('ref-flags.json')))") <(python3 -c "import json;print(json.load(open('ref-file-flags.json')))") && echo "0.7.2 LINEAGE EXTRACTS CLEANLY: same certificates and flags as in the APK"

      - name: Self-test the identity comparison (it must fail on any disagreement)
        run: |
          set -e
          T="$RUNNER_TEMP/selftest"; mkdir -p "$T"
          echo '{"current":["f9bc5316"],"history":["be122133 flags: 5","f9bc5316 flags: 17"]}' > "$T/sys.json"
          echo '{"certs":["aa","bb"]}' > "$T/exp.json"
          ok='{"current_hash":["f9bc5316"],"history_hash":["be122133","f9bc5316"],"current_sha256":["bb"],"history_sha256":["aa","bb"]}'
          echo "$ok" > "$T/app.json"
          python3 scripts/identity_compare.py "$T/sys.json" "$T/app.json" "$T/exp.json" "$T/o.json"
          for bad in \
            '{"current_hash":["0000"],"history_hash":["be122133","f9bc5316"],"current_sha256":["bb"],"history_sha256":["aa","bb"]}' \
            '{"current_hash":["f9bc5316"],"history_hash":["0000","f9bc5316"],"current_sha256":["bb"],"history_sha256":["aa","bb"]}' \
            '{"current_hash":["f9bc5316"],"history_hash":["be122133","f9bc5316"],"current_sha256":["cc"],"history_sha256":["aa","bb"]}' \
            '{"current_hash":["f9bc5316"],"history_hash":["be122133","f9bc5316"],"current_sha256":["bb"],"history_sha256":["xx","bb"]}' \
            '{"error":"no signingInfo"}'; do
            echo "$bad" > "$T/app.json"
            if python3 scripts/identity_compare.py "$T/sys.json" "$T/app.json" "$T/exp.json" "$T/o.json" > /dev/null 2>&1; then
              echo "SELF-TEST FAIL: a mismatch was accepted: $bad"; exit 1
            fi
          done
          echo "SELF-TEST OK: the comparison passes on agreement and fails on all 5 kinds of disagreement"

      - name: Build the unsigned probe
        run: ./gradlew --no-daemon :signingprobe:assembleRelease

      - name: Make throwaway keys and sign the two copies
        run: |
          set -e
          AS="$ANDROID_HOME/build-tools/$BT/apksigner"
          ZA="$ANDROID_HOME/build-tools/$BT/zipalign"
          K="$RUNNER_TEMP/probe-keys"; mkdir -p "$K"
          trap 'rm -rf "$K"' EXIT
          PW=$(openssl rand -hex 16)          # random, never printed or kept
          export PW
          for n in A B; do
            keytool -genkeypair -keystore "$K/$n.p12" -storetype PKCS12 -storepass "$PW" -keypass "$PW" \
              -alias "probe$n" -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=RBSB signing probe throwaway key $n" > /dev/null 2>&1
          done
          IN=$(ls tools/signing-probe/build/outputs/apk/release/*-unsigned.apk | head -1)
          "$ZA" -f -p 4 "$IN" "$K/aligned.apk"
          mkdir -p kit

          # Phone copy: exactly the 0.7.2 release.yml rotation and signing options
          "$AS" rotate --out "$K/lineage.bin" \
            --old-signer --ks "$K/A.p12" --ks-pass env:PW --ks-key-alias probeA \
              --set-installed-data true --set-permission true --set-rollback false --set-shared-uid false --set-auth false \
            --new-signer --ks "$K/B.p12" --ks-pass env:PW --ks-key-alias probeB
          "$AS" sign --ks "$K/A.p12" --ks-pass env:PW --ks-key-alias probeA \
            --next-signer --ks "$K/B.p12" --ks-pass env:PW --ks-key-alias probeB \
            --lineage "$K/lineage.bin" --rotation-min-sdk-version 28 \
            --out kit/probe-phone.apk "$K/aligned.apk"

          # Watch copy: key B ONLY + the lineage extracted from the phone APK (public data).
          # Key A's private key is deleted first, just as the real watch release will not need
          # the test key: the production key plus 0.7.2's published lineage is enough.
          python3 scripts/extract_lineage.py kit/probe-phone.apk "$K/extracted.bin"
          # Prove the extractor is exact: it must equal the lineage file apksigner created
          cmp "$K/lineage.bin" "$K/extracted.bin" || { echo "Extracted lineage differs from apksigner's"; od -A x -t x1 "$K/lineage.bin" | head -3; od -A x -t x1 "$K/extracted.bin" | head -3; exit 1; }
          echo "EXTRACTOR OK: the lineage extracted from the phone APK is byte-identical to apksigner's"
          rm -f "$K/A.p12" "$K/lineage.bin"
          # v3 only: every supported watch (Wear OS 4+, API 33+) verifies the v3 signature, which
          # carries the history. v1/v2 would need the old key's private key, so they are left out.
          "$AS" sign --ks "$K/B.p12" --ks-pass env:PW --ks-key-alias probeB \
            --lineage "$K/extracted.bin" --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out kit/probe-watch.apk "$K/aligned.apk"
          rm -f kit/*.idsig

      - name: Check both copies against each other and against 0.7.2's flags
        run: |
          set -e
          AS="$ANDROID_HOME/build-tools/$BT/apksigner"
          cd kit
          for a in probe-phone probe-watch; do
            "$AS" verify --verbose --print-certs --min-sdk-version 30 "$a.apk" > "$a-verify.txt"
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$a-verify.txt" || { echo "$a: no v3 signature"; exit 1; }
            "$AS" lineage --in "$a.apk" --print-certs -v > "$a-lineage.txt"
            python3 ../scripts/lineage_check.py "$a-lineage.txt" --json "$a-flags.json"
          done
          python3 - <<'PY'
          import json
          ref = json.load(open("../ref-flags.json"))
          ph = json.load(open("probe-phone-flags.json"))
          wa = json.load(open("probe-watch-flags.json"))
          assert ph == wa, f"phone and watch histories differ:\n{ph}\n{wa}"
          assert ph["old_flags"] == ref["old_flags"], f"old-key flags differ from 0.7.2: {ph['old_flags']} vs {ref['old_flags']}"
          print("SAME HISTORY: phone and watch copies carry identical lineages (A -> B)")
          print("SAME FLAGS AS 0.7.2 for the old key:", ph["old_flags"])
          PY
          A=$(grep -m1 "Signer #1 certificate SHA-256" probe-phone-verify.txt | awk '{print $NF}')
          B=$(grep -m1 "Signer #1 certificate SHA-256" probe-watch-verify.txt | awk '{print $NF}')
          echo "Phone copy current signer: $A"; echo "Watch copy current signer: $B"
          [ -n "$A" ] && [ "$A" = "$B" ] || { echo "Current signers differ"; exit 1; }
          echo "KIT OK: same current signer and same signing history on both copies"
          { echo "Signing gate 1 kit, run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}"; echo "Throwaway keys, made in this run and deleted."; echo
            for f in probe-phone probe-watch; do echo "== $f"; cat "$f-lineage.txt"; echo; done; } > CERTS.txt
          sha256sum probe-phone.apk probe-watch.apk > SHA256SUMS && cat SHA256SUMS
          # Keep apksigner's reading of each APK file: the identity each device must report
          mv probe-phone-flags.json expected-probe-phone.json
          mv probe-watch-flags.json expected-probe-watch.json
          rm -f ./*-verify.txt ./*-lineage.txt
          cp ../docs/SIGNING_GATE_1.md .
      - uses: actions/upload-artifact@v4
        with:
          name: signing-gate-1-kit
          path: kit/
          retention-days: 30

  identity:
    name: "Identity on ${{ matrix.device }} (no pairing)"
    needs: kit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: "phone emulator (API 34)", apk: probe-phone.apk, img: "system-images;android-34;google_apis;x86_64", dev: "pixel_6", tag: phone }
          - { device: "Wear OS 6 watch emulator", apk: probe-watch.apk, img: "wear36", dev: "wearos_large_round", tag: watch }
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: signing-gate-1-kit
          path: kit
      - name: System image
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null || true
          IMG="${{ matrix.img }}"
          if [ "$IMG" = wear36 ]; then
            IMG=$({ "$SDK" --list 2>/dev/null; "$SDK" --list --channel=3 2>/dev/null; } | grep -oE "system-images;android-36(\.[0-9]+)?;[a-z0-9_-]*wear[a-z0-9_-]*;x86_64" | sort -u | head -1)
          fi
          [ -n "$IMG" ] || { echo "No image"; exit 1; }
          echo "IMG=$IMG" >> "$GITHUB_ENV"; echo "Using $IMG"
          CH=""; "$SDK" --list 2>/dev/null | grep -q "$IMG" || CH="--channel=3"
          yes | "$SDK" $CH "emulator" "platform-tools" "$IMG" > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot, install, read the signing identity
        run: |
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "$ANDROID_AVD_HOME" "$HOME/.android"
          echo no | "$AVDM" create avd -n probe -k "$IMG" -d "${{ matrix.dev }}" --force
          [ -f "$HOME/.android/adbkey" ] || adb keygen "$HOME/.android/adbkey"
          export ADB_VENDOR_KEYS="$HOME/.android/adbkey"
          adb kill-server || true; adb start-server
          emulator -avd probe -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot > emulator.log 2>&1 &
          EMU=$!
          for i in $(seq 1 150); do
            kill -0 "$EMU" 2>/dev/null || { tail -40 emulator.log; echo "Emulator exited"; exit 1; }
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 4
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { tail -40 emulator.log; echo "Did not boot"; exit 1; }
          sleep 30
          echo "Android API $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          adb install -r "kit/${{ matrix.apk }}"
          PKG=io.github.shanebl030glitch.signingprobe
          adb shell dumpsys package "$PKG" > dumpsys.txt
          grep -iE "signatures|signing|past" dumpsys.txt | head -20
          python3 scripts/identity_from_dumpsys.py dumpsys.txt > "identity-${{ matrix.tag }}.json"
          cat "identity-${{ matrix.tag }}.json"
          # What the app itself sees (PackageManager.signingInfo): the probe logs it as JSON
          adb logcat -c || true
          adb shell svc power stayon true || true
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell am start -W -n "$PKG/.ProbeActivity" > /dev/null
          for i in $(seq 1 15); do
            adb logcat -d -s RBSBProbe:I > probe-log.txt
            grep -q "IDENTITY " probe-log.txt && break
            sleep 2
          done
          grep -m1 "IDENTITY " probe-log.txt | sed -E 's/.*IDENTITY //' > app-identity.json
          [ -s app-identity.json ] || { echo "The probe did not log its identity"; cat probe-log.txt; exit 1; }
          echo "App-reported identity: $(cat app-identity.json)"
          # Gate 1 per-device check: system, app and APK file must agree (fails on any difference)
          APKFILE="${{ matrix.apk }}"
          python3 scripts/identity_compare.py "identity-${{ matrix.tag }}.json" app-identity.json \
            "kit/expected-${APKFILE%.apk}.json" "device-${{ matrix.tag }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-${{ matrix.tag }}
          path: device-${{ matrix.tag }}.json
          retention-days: 7

  compare:
    name: Same identity on phone and watch
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: identity-*
          merge-multiple: true
      - name: Compare
        run: |
          cat device-phone.json; echo; cat device-watch.json; echo
          python3 - <<'PY'
          import json
          p = json.load(open("device-phone.json")); w = json.load(open("device-watch.json"))
          checks = [
              ("system current signer", p["system_current"], w["system_current"]),
              ("system signing history and flags", p["system_history"], w["system_history"]),
              ("app-reported current signer SHA-256", p["current_sha256"], w["current_sha256"]),
              ("app-reported history SHA-256", p["history_sha256"], w["history_sha256"]),
          ]
          bad = [name for name, a, b in checks if not a or a != b]
          for name, a, b in checks:
              print(f"{'SAME' if a == b and a else 'DIFFERENT'}: {name}: phone {a} / watch {b}")
          if bad:
              raise SystemExit("GATE 1 IDENTITY: FAIL (" + ", ".join(bad) + ")")
          assert len(p["history_sha256"]) == 2
          print("GATE 1 IDENTITY: PASS. On each device the system, the app and the APK file agree;")
          print("and the phone and watch report the same current signer and the same two-key history.")
          PY
