# Signing gate 1 kit (approved plan, section 8). Builds the throwaway signing probe and signs
# it with THROWAWAY keys made fresh in this run (never stored, never committed):
#   key A plays the role of the old public test key, key B the role of the production key.
#   phone APK: A -> B with a v3 rotation lineage, using the SAME apksigner options as
#              RBSB-Weather Android's release workflow (rotation-min-sdk 28, same capabilities)
#   watch APK: B only (the approved plan for the RBSB watch app)
#   watch-lineage APK: A -> B lineage (the fallback, only needed if the B-only test fails)
# Shane then pairs a phone emulator and a watch emulator in Android Studio and follows
# docs/SIGNING_GATE_1.md. No real key is ever used here.
# Created By Shane BlackbuRn
name: Signing gate 1 kit

on:
  push:
    branches: ["claude/stage-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build the unsigned probe
        run: ./gradlew --no-daemon :signingprobe:assembleRelease
      - name: Make throwaway keys and sign three copies
        run: |
          set -e
          AS="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZA="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          K="$RUNNER_TEMP/probe-keys"; mkdir -p "$K"
          trap 'rm -rf "$K"' EXIT
          PW=$(openssl rand -hex 16)          # random, never printed or kept
          export PW
          for n in A B; do
            keytool -genkeypair -keystore "$K/$n.p12" -storetype PKCS12 -storepass "$PW" -keypass "$PW" \
              -alias "probe$n" -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=RBSB signing probe throwaway key $n" > /dev/null 2>&1
          done
          IN=$(ls tools/signing-probe/build/outputs/apk/release/*-unsigned.apk | head -1)
          "$ZA" -f -p 4 "$IN" "$K/aligned.apk"

          # Same capability flags as RBSB-Weather Android's release.yml
          "$AS" rotate --out "$K/lineage.bin" \
            --old-signer --ks "$K/A.p12" --ks-pass env:PW --ks-key-alias probeA \
              --set-installed-data true --set-permission true --set-rollback false --set-shared-uid false --set-auth false \
            --new-signer --ks "$K/B.p12" --ks-pass env:PW --ks-key-alias probeB

          mkdir -p kit
          "$AS" sign --ks "$K/A.p12" --ks-pass env:PW --ks-key-alias probeA \
            --next-signer --ks "$K/B.p12" --ks-pass env:PW --ks-key-alias probeB \
            --lineage "$K/lineage.bin" --rotation-min-sdk-version 28 \
            --out kit/probe-phone-rotated.apk "$K/aligned.apk"
          "$AS" sign --ks "$K/B.p12" --ks-pass env:PW --ks-key-alias probeB \
            --out kit/probe-watch-newkey-only.apk "$K/aligned.apk"
          "$AS" sign --ks "$K/A.p12" --ks-pass env:PW --ks-key-alias probeA \
            --next-signer --ks "$K/B.p12" --ks-pass env:PW --ks-key-alias probeB \
            --lineage "$K/lineage.bin" --rotation-min-sdk-version 28 \
            --out kit/probe-watch-lineage-fallback.apk "$K/aligned.apk"
          rm -f kit/*.idsig
      - name: Verify the three copies are signed as intended
        run: |
          set -e
          AS="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          cd kit
          fp() { "$AS" verify --print-certs --min-sdk-version "$2" "$1" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}'; }
          {
            echo "Signing gate 1 kit, run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}"
            echo "Keys are throwaway, made in this run and deleted. Fingerprints for reference only."
            echo
            for a in probe-phone-rotated.apk probe-watch-newkey-only.apk probe-watch-lineage-fallback.apk; do
              echo "== $a"
              "$AS" verify --verbose --print-certs --min-sdk-version 30 "$a" | grep -E "Verified using|Signer|certificate SHA-256|Number of signers" || true
              echo
            done
          } | tee CERTS.txt
          PHONE_NEW=$(fp probe-phone-rotated.apk 30)        # on Android 11+ the v3 signer is key B
          WATCH=$(fp probe-watch-newkey-only.apk 30)
          [ -n "$PHONE_NEW" ] && [ -n "$WATCH" ] || { echo "Missing signer"; exit 1; }
          grep -A3 "== probe-phone-rotated.apk" CERTS.txt > /dev/null
          "$AS" verify --verbose --min-sdk-version 30 probe-phone-rotated.apk | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || { echo "Phone copy has no v3 signature"; exit 1; }
          "$AS" verify --verbose --print-certs --min-sdk-version 30 probe-watch-newkey-only.apk | grep -q "Number of signers: 1" || { echo "Watch copy should have one signer"; exit 1; }
          echo "Phone copy current signer (v3, Android 9+): $PHONE_NEW"
          echo "Watch copy signer:                         $WATCH"
          [ "$PHONE_NEW" = "$WATCH" ] || { echo "MISMATCH: the rotated phone copy's current signer is not key B"; exit 1; }
          echo "KIT OK: the phone copy rotates A -> B; the watch copy is signed by B only."
          sha256sum *.apk > SHA256SUMS && cat SHA256SUMS
          cp ../docs/SIGNING_GATE_1.md .
      - uses: actions/upload-artifact@v4
        with:
          name: signing-gate-1-kit
          path: kit/
          retention-days: 30
